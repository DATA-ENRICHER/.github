<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="How it works: an EAN, the own crawler finds the product, AI checks the photos, texts are written in 18 languages, and the result goes into your shop via the module or the API.">
<title>How it works: an EAN, the own crawler finds the product, AI checks the photos, texts are written in 18 languages, and the result goes into your shop via the module or the API.</title>
<style>.card { animation: up .7s ease backwards; } @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } } .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; } @keyframes flow { to { stroke-dashoffset: -14; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect width="1200" height="200" rx="18" fill="#0D1012"/><text x="40" y="52" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#9AA2AB">HOW IT WORKS</text><line class="flow" x1="120" y1="122" x2="1080" y2="122" stroke="#2FB3AD" stroke-width="3"/><g class="card" style="animation-delay:0.00s"><circle cx="120" cy="122" r="26" fill="#2FB3AD" stroke="#2FB3AD" stroke-width="3"/><text x="120" y="128" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="120" y="80" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#EEF0F2" text-anchor="middle">EAN</text><text x="120" y="174" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA2AB" text-anchor="middle">one barcode</text></g><g class="card" style="animation-delay:0.15s"><circle cx="360" cy="122" r="26" fill="#151A1D" stroke="#2FB3AD" stroke-width="3"/><text x="360" y="128" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2FB3AD" text-anchor="middle">2</text><text x="360" y="80" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#EEF0F2" text-anchor="middle">Find</text><text x="360" y="174" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA2AB" text-anchor="middle">own crawler</text></g><g class="card" style="animation-delay:0.30s"><circle cx="600" cy="122" r="26" fill="#151A1D" stroke="#2FB3AD" stroke-width="3"/><text x="600" y="128" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2FB3AD" text-anchor="middle">3</text><text x="600" y="80" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#EEF0F2" text-anchor="middle">Check</text><text x="600" y="174" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA2AB" text-anchor="middle">AI photo check</text></g><g class="card" style="animation-delay:0.45s"><circle cx="840" cy="122" r="26" fill="#151A1D" stroke="#2FB3AD" stroke-width="3"/><text x="840" y="128" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2FB3AD" text-anchor="middle">4</text><text x="840" y="80" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#EEF0F2" text-anchor="middle">Write</text><text x="840" y="174" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA2AB" text-anchor="middle">18 languages</text></g><g class="card" style="animation-delay:0.60s"><circle cx="1080" cy="122" r="26" fill="#2FB3AD" stroke="#2FB3AD" stroke-width="3"/><text x="1080" y="128" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="1080" y="80" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#EEF0F2" text-anchor="middle">Your shop</text><text x="1080" y="174" font-family="Archivo, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA2AB" text-anchor="middle">module or API</text></g>
