<style>.rise { animation: rise .8s ease backwards; } @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .5s ease backwards; } @keyframes grow { from { transform: scaleY(0); } } .scan { opacity: 0; animation: scan 3.6s ease-in-out infinite; } @keyframes scan { 0%, 100% { transform: translateY(0); opacity: 0; } 10%, 90% { opacity: .9; } 50% { transform: translateY(150px); } } .ln { animation: show .4s ease backwards; } @keyframes show { from { opacity: 0; } } .cursor { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
